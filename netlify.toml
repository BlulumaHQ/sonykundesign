# Netlify only (Cloudflare uses wrangler.jsonc + worker/index.ts).
# Kept out of public/_redirects so a future Cloudflare Workers deploy doesn't apply these rules.
[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/zh/*"
  to = "/zh.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
