# Netlify only (Cloudflare uses wrangler.jsonc + worker/index.ts).
# Kept out of public/_redirects so a future Cloudflare Workers deploy doesn't apply these rules.
[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Mia AI receptionist: short link for the post-call details form (proxied to n8n).
[[redirects]]
  from = "/details"
  to = "https://n8n-production-69d1bdd4.up.railway.app/webhook/sonykun-details"
  status = 200
  force = true

[[redirects]]
  from = "/details/submit"
  to = "https://n8n-production-69d1bdd4.up.railway.app/webhook/sonykun-details-submit"
  status = 200
  force = true

[[redirects]]
  from = "/zh/*"
  to = "/zh.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
